name: Security check

# Runs on every PR and every push to main. Make this a *required* status check
# in branch protection so a PR cannot merge while it fails.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  config-integrity:
    name: Build config integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No `npm install` before this step, deliberately: the check must run
      # before any project code or dependency script is executed.
      - name: Check build configs for tampering
        run: node scripts/check-config-integrity.mjs

      - name: Scan repository for known payload indicators
        run: |
          if grep -rl --binary-files=without-match \
               -e "A8-446" \
               -e "166\.88\.134\.62" \
               -e "xorDecode" \
               -e "getClb" \
               -e "global\['_t_s'\]" \
               . --exclude-dir=.git --exclude-dir=node_modules \
               --exclude-dir=.github 2>/dev/null; then
            echo "::error::Known payload indicators found in the repository."
            exit 1
          fi
          echo "No payload indicators found."

  gate-tests:
    name: Gate tests
    # Only after the integrity check passes: installing and running tests
    # executes project config (vitest.config.mts) and dependency code.
    needs: config-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: no dependency install hooks run in CI.
      - run: npm ci --ignore-scripts

      - run: npm test
