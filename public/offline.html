<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline - XBanka</title>
    <style>
      :root { color-scheme: light dark; --bg: #f9f9f9; --fg: #171717; --muted: #5b6270; --brand: #0c9a8e; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121315; --fg: #f4f5f6; --muted: #a4aab4; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
      main { max-width: 360px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
      button { font: inherit; font-weight: 600; color: #fff; background: var(--brand); border: 0; border-radius: 10px; padding: 12px 28px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>XBanka needs an internet connection to show your balances and move money. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
